# GitLab CI/CD для HR Analytics проекта
# https://docs.gitlab.com/ee/ci/yaml/

# Определяем глобальные переменные
variables:
  # Docker
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE
  DOCKER_IMAGE_TAG: $CI_COMMIT_REF_SLUG
  
  # Python
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHON_VERSION: "3.11"
  
  # Отчеты
  REPORT_OUTPUT_DIR: "reports"
  
  # URL данных (можно переопределить в GitLab CI/CD Variables)
  DATA_FILE_URL: "https://storage.yandexcloud.net/sds-hr/sds-hr/%D0%A0%D0%B5%D0%B5%D1%81%D1%82%D1%80_%D1%81%D0%BE%D1%82%D1%80%D1%83%D0%B4%D0%BD%D0%B8%D0%BA%D0%BE%D0%B2.xlsx"

# Определяем этапы пайплайна
stages:
  - test          # Тестирование и валидация
  - build         # Сборка Docker образа
  - report        # Генерация HR-отчета
  - deploy        # Деплой (опционально)

# Кэширование зависимостей Python
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip
    - venv/

# =============================================================================
# STAGE: TEST - Проверка кода и данных
# =============================================================================

# Проверка Python кода (линтинг)
lint:python:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install --upgrade pip
    - pip install flake8 pylint
  script:
    - echo "Запуск линтера Python..."
    - flake8 main.py api.py --max-line-length=120 --ignore=E501,W503 || true
    - echo "Линтинг завершен"
  allow_failure: true
  only:
    - merge_requests
    - main
    - dev

# Проверка структуры данных
test:data-structure:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - echo "Проверка структуры Excel файла..."
    - python TestCheck/analyze_excel_from_url.py
    - echo "Структура данных проверена"
  artifacts:
    reports:
      junit: test-results.xml
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - dev

# Проверка корректности метрик
test:verify-metrics:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - echo "Проверка корректности метрик отчета..."
    - python TestCheck/verify_report_numbers.py
    - echo "Метрики проверены"
  artifacts:
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - dev

# =============================================================================
# STAGE: BUILD - Сборка Docker образа
# =============================================================================

# Сборка Docker образа для API
build:docker-api:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Сборка Docker образа..."
    - docker build -t $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG -f Dockerfile .
    - |
      # Тегируем latest только для main ветки
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        docker tag $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG $DOCKER_IMAGE_NAME:latest
        docker push $DOCKER_IMAGE_NAME:latest
      fi
    - echo "Публикация образа в GitLab Container Registry..."
    - docker push $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG
    - echo "Docker образ собран и опубликован"
  only:
    - main
    - dev
    - tags

# Сборка Docker образа для скриптов
build:docker-script:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Сборка Docker образа для скриптов..."
    - docker build -t $DOCKER_IMAGE_NAME/script:$DOCKER_IMAGE_TAG -f Dockerfile.script .
    - |
      # Тегируем latest только для main ветки
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        docker tag $DOCKER_IMAGE_NAME/script:$DOCKER_IMAGE_TAG $DOCKER_IMAGE_NAME/script:latest
        docker push $DOCKER_IMAGE_NAME/script:latest
      fi
    - docker push $DOCKER_IMAGE_NAME/script:$DOCKER_IMAGE_TAG
    - echo "Docker образ для скриптов собран"
  only:
    - main
    - dev

# =============================================================================
# STAGE: REPORT - Генерация HR-отчета
# =============================================================================

# Генерация HR-отчета (production - main)
report:generate:
  stage: report
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - mkdir -p $REPORT_OUTPUT_DIR
  script:
    - echo "Генерация HR-отчета (PRODUCTION)..."
    - python main.py
    - cp "HR-отчет.pdf" "$REPORT_OUTPUT_DIR/HR-отчет-$(date +%Y-%m-%d).pdf"
    - cp "HR-отчет.pdf" "$REPORT_OUTPUT_DIR/HR-отчет-latest.pdf"
    - echo "Отчет сгенерирован"
    - ls -lh $REPORT_OUTPUT_DIR/
  artifacts:
    name: "hr-report-prod-${CI_COMMIT_SHORT_SHA}"
    paths:
      - $REPORT_OUTPUT_DIR/
      - logs/
    expire_in: 30 days
  only:
    - main
    - schedules
    - web
  when: always

# Генерация HR-отчета (development - dev)
report:generate-dev:
  stage: report
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - mkdir -p $REPORT_OUTPUT_DIR
  script:
    - echo "Генерация HR-отчета (DEV)..."
    - echo "Ветка - $CI_COMMIT_REF_NAME"
    - echo "Коммит - $CI_COMMIT_SHORT_SHA"
    - python main.py
    - cp "HR-отчет.pdf" "$REPORT_OUTPUT_DIR/HR-отчет-dev-$(date +%Y-%m-%d-%H-%M).pdf"
    - cp "HR-отчет.pdf" "$REPORT_OUTPUT_DIR/HR-отчет-dev-latest.pdf"
    - echo "Dev отчет сгенерирован"
    - ls -lh $REPORT_OUTPUT_DIR/
  artifacts:
    name: "hr-report-dev-${CI_COMMIT_SHORT_SHA}"
    paths:
      - $REPORT_OUTPUT_DIR/
      - logs/
    expire_in: 7 days
  only:
    - dev
    - web
  when: on_success

# Генерация отчета с кастомными параметрами (manual job)
report:generate-custom:
  stage: report
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - mkdir -p $REPORT_OUTPUT_DIR
  script:
    - echo "Генерация HR-отчета с кастомными параметрами..."
    - |
      if [ -n "$CUSTOM_DATA_FILE_URL" ]; then
        export DATA_FILE_URL=$CUSTOM_DATA_FILE_URL
      fi
    - python main.py
    - cp "HR-отчет.pdf" "$REPORT_OUTPUT_DIR/HR-отчет-custom-$(date +%Y-%m-%d-%H-%M).pdf"
    - echo "Кастомный отчет сгенерирован"
  artifacts:
    name: "hr-report-custom-${CI_COMMIT_SHORT_SHA}"
    paths:
      - $REPORT_OUTPUT_DIR/
      - logs/
    expire_in: 7 days
  when: manual
  only:
    - main
    - dev

# =============================================================================
# STAGE: DEPLOY - Развертывание
# =============================================================================

# Деплой в dev окружение (автоматически для ветки dev)
deploy:dev:
  stage: deploy
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache openssh-client
  script:
    - echo "Деплой в dev окружение..."
    - |
      if [ -n "$DEV_SERVER" ]; then
        echo "Подключение к dev серверу: $DEV_SERVER"
        echo "Используемый образ: $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG"
        echo "export DOCKER_IMAGE=$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG" > deploy.env
        # ssh user@$DEV_SERVER "cd /opt/hr-analytics && docker-compose pull && docker-compose up -d"
        echo "Деплой в dev выполнен"
      else
        echo "DEV_SERVER не настроен. Пропускаем деплой."
      fi
  environment:
    name: dev
    url: http://${DEV_SERVER}:8000
    on_stop: stop:dev
  only:
    - dev
  when: manual

# Остановка dev окружения
stop:dev:
  stage: deploy
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache openssh-client
  script:
    - echo "Остановка dev окружения..."
    - |
      if [ -n "$DEV_SERVER" ]; then
        # ssh user@$DEV_SERVER "cd /opt/hr-analytics && docker-compose down"
        echo "Dev окружение остановлено"
      fi
  environment:
    name: dev
    action: stop
  only:
    - dev
  when: manual

# Деплой в staging окружение
deploy:staging:
  stage: deploy
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache openssh-client
  script:
    - echo "Деплой в staging окружение..."
    - |
      if [ -n "$STAGING_SERVER" ]; then
        echo "Подключение к staging серверу: $STAGING_SERVER"
        echo "Используемый образ: $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG"
        echo "export DOCKER_IMAGE=$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG" > deploy.env
        # ssh user@$STAGING_SERVER "cd /opt/hr-analytics && docker-compose pull && docker-compose up -d"
        echo "Деплой в staging выполнен"
      else
        echo "STAGING_SERVER не настроен. Пропускаем деплой."
      fi
  environment:
    name: staging
    url: http://${STAGING_SERVER}:8000
  only:
    - dev
  when: manual

# Деплой в production окружение
deploy:production:
  stage: deploy
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache openssh-client
  script:
    - echo "Деплой в production окружение..."
    - |
      if [ -n "$PRODUCTION_SERVER" ]; then
        echo "Подключение к production серверу: $PRODUCTION_SERVER"
        # Здесь добавьте команды для деплоя на ваш production сервер
        echo "export DOCKER_IMAGE=$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG" > deploy.env
        # ssh user@$PRODUCTION_SERVER "cd /opt/hr-analytics && docker-compose pull && docker-compose up -d"
        echo "Деплой в production выполнен"
      else
        echo "PRODUCTION_SERVER не настроен. Пропускаем деплой."
      fi
  environment:
    name: production
    url: http://${PRODUCTION_SERVER}:8000
  only:
    - main
    - tags
  when: manual

# =============================================================================
# ДОПОЛНИТЕЛЬНЫЕ ДЖОБЫ
# =============================================================================

# Очистка старых артефактов
cleanup:artifacts:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Очистка старых артефактов..."
    - echo "Артефакты автоматически удаляются согласно настройкам expire_in"
    - echo "Очистка завершена"
  only:
    - schedules
  when: manual

# Уведомление о завершении пайплайна (webhook)
notify:success:
  stage: deploy
  image: curlimages/curl:latest
  script:
    - echo "Отправка уведомления об успешном завершении..."
    - |
      if [ -n "$WEBHOOK_URL" ]; then
        curl -X POST $WEBHOOK_URL \
          -H "Content-Type: application/json" \
          -d "{\"text\":\"HR Analytics Pipeline успешно завершен!\",\"pipeline\":\"$CI_PIPELINE_URL\",\"commit\":\"$CI_COMMIT_SHORT_SHA\"}"
      fi
  when: on_success
  only:
    - main
  allow_failure: true

# =============================================================================
# ЗАПЛАНИРОВАННЫЕ ЗАДАЧИ
# =============================================================================
# В GitLab UI настройте Schedules для автоматической генерации отчетов:
# CI/CD -> Schedules -> New schedule
# Например: "0 9 * * 1-5" - каждый будний день в 9:00
# =============================================================================

