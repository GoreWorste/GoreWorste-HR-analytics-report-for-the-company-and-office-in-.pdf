services:
  hr-report-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr-report-api
    ports:
      - "8000:8000"
    volumes:
      # Монтируем директорию для логов
      - ./logs:/app/logs
      # Монтируем директорию для сохранения отчетов (опционально)
      - ./reports:/app/reports
    environment:
      # URL файла данных на сервере (по умолчанию)
      - DATA_FILE_URL=https://storage.yandexcloud.net/sds-hr/sds-hr/%D0%A0%D0%B5%D0%B5%D1%81%D1%82%D1%80_%D1%81%D0%BE%D1%82%D1%80%D1%83%D0%B4%D0%BD%D0%B8%D0%BA%D0%BE%D0%B2.xlsx
      # Для локального файла (если нужно):
      # - DATA_FILE_PATH=/app/data/dataEmployees.xlsx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s





